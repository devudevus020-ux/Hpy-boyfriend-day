<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Boyfriend Day ❤️</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffdde8, #fff0f5);
  color: #5b1830;
  min-height: 100vh;
  text-align: center;
}

.page {
  display: none;
  min-height: 100vh;
  padding: 60px 25px;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  animation: fade 0.6s ease;
}

.page.active {
  display: flex;
}

h1 {
  font-size: 42px;
  margin-bottom: 20px;
}

h2 {
  font-size: 30px;
  margin-bottom: 25px;
}

p {
  font-size: 18px;
  line-height: 1.7;
  max-width: 600px;
}

.heart {
  font-size: 70px;
  animation: beat 1s infinite;
  margin-bottom: 20px;
}

button {
  border: none;
  background: #e75480;
  color: white;
  padding: 14px 25px;
  border-radius: 30px;
  font-size: 17px;
  margin: 12px;
  cursor: pointer;
  box-shadow: 0 5px 15px #d98aa2;
}

button:hover {
  transform: scale(1.05);
}

.card {
  background: rgba(255,255,255,0.8);
  padding: 25px;
  border-radius: 25px;
  max-width: 600px;
  margin: 12px;
  box-shadow: 0 8px 25px rgba(150,50,80,0.15);
}

.option {
  display: inline-block;
  background: white;
  padding: 18px;
  margin: 8px;
  border-radius: 20px;
  min-width: 130px;
}

.final {
  font-size: 25px;
  font-weight: bold;
}

@keyframes beat {
  50% { transform: scale(1.15); }
}

@keyframes fade {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<section class="page active" id="page1">
  <div class="heart">❤️</div>
  <h1>Happy Boyfriend Day</h1>
  <h2>My Favourite Person 🥹</h2>
  <p>
    This little website is just for you...
    because you deserve something special today. 💗
  </p>
  <button onclick="nextPage(2)">Start Our Little Story →</button>
</section>

<!-- PAGE 2 -->
<section class="page" id="page2">
  <h2>This or That? 🎀</h2>

  <div class="card">
    <div class="option">🫂 Hug</div>
    <div class="option">💋 Kiss</div>
    <div class="option">📞 Call</div>
